screen:
  min_price: 3.0
  max_price: 100.0
  min_turnover: 1.0
  min_market_cap: 0
  max_market_cap: 500
  exclude_st: true
  exclude_beijing: false
  exclude_chinext: true
  top_n: 30
  min_score: 2
backtest:
  start_date: '2025-01-01'
  end_date: ''
  holding_days: 7
  stop_loss: -7.0
  take_profit: 20.0
  top_n: 10
  interval_days: 7
  initial_capital: 100000
  max_positions: 5
report:
  output_dir: reports
  include_concepts: true
logging:
  level: INFO
  file: ''
sentiment:
  enable_board_tier: true
  enable_reopen: true
  enable_weak2strong: true
  enable_cycle: true
factors:
  enable: true
  weights:
    mom_1d: 0.1
    mom_5d: 0.12
    volume_ratio: 0.12
    ma_slope_5: 0.1
    macd_state: 0.08
    big_order_ratio: 0.08
serverchan:
  # 密钥不再明文入库；通过环境变量 SERVERCHAN_KEY 注入（push.py 已支持兜底）
  send_key: ''
wecom:
  # 或通过环境变量 WECOM_WEBHOOK_URL 注入
  webhook_url: ''
